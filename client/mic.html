<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lutheria — Micro</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 3rem auto; padding: 0 1rem; }
    h1 { font-size: 1.3rem; }
    .row { display: flex; gap: .5rem; margin: 1rem 0; align-items: center; }
    input, button { font-size: 1rem; padding: .5rem .8rem; }
    button { cursor: pointer; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    #start { background: #1a7f37; color: #fff; border: 0; border-radius: 6px; }
    #stop { background: #c9302c; color: #fff; border: 0; border-radius: 6px; }
    #status.ok { color: #1a7f37; font-weight: 600; }
    #status.err { color: #c9302c; font-weight: 600; }
    #log { margin-top: 1rem; font-size: .85rem; color: #555; max-height: 40vh; overflow-y: auto; }
    label { display: block; margin-bottom: .25rem; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Lutheria — émission (malgache)</h1>
  <label for="token">Token producteur</label>
  <input id="token" type="password" placeholder="LUTHERIA_MIC_TOKEN" autocomplete="off" />
  <div class="row">
    <button id="start">Démarrer le micro</button>
    <button id="stop" disabled>Arrêter</button>
    <span id="status"></span>
  </div>
  <div id="log"></div>
  <script src="mic.js"></script>
</body>
</html>
