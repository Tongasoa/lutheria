# Nginx devant uvicorn — TLS (auto-signé v1), WebSocket upgrade, statique.
#
# Installation (Ubuntu) :
#   sudo cp deploy/nginx-lutheria.conf /etc/nginx/sites-available/lutheria
#   sudo ln -s /etc/nginx/sites-available/lutheria /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Pour Let's Encrypt plus tard (DuckDNS ou vrai domaine) :
#   sudo sed -i 's/server_name _;/server_name lutheria.duckdns.org;/' /etc/nginx/sites-available/lutheria
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d lutheria.duckdns.org
#   -> certbot réécrit ce fichier proprement.
# Prod 26.04 : SG doit ouvrir 80 (http-01) en plus de 443 ; voir ADR 0007.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/lutheria.crt;
    ssl_certificate_key /etc/nginx/certs/lutheria.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Limites prudentes (ADR 0005) : frames PCM 100 ms = ~3 Ko ; marge large.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade (/ws/mic, /ws/listen)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Un segment de parole peut traverser ASR+MT (~10 s max) : pas de timeout
        # pendant qu'une connexion WS est ouverte mais silencieuse.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
